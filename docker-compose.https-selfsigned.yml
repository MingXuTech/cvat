# Use HTTPS without a public domain name (self-signed certificate).
#
# Usage:
#   1) Create certs (example for IP access):
#      mkdir -p certs
#      # IMPORTANT: use a plain IP here (no http://, no https://, no port, no trailing slash)
#      IP=192.168.1.10
#      openssl req -x509 -newkey rsa:2048 -sha256 -days 825 -nodes \
#        -keyout certs/cvat.key -out certs/cvat.crt \
#        -subj "/CN=$IP" \
#        -addext "subjectAltName=IP:$IP"
#
#   2) Start CVAT:
#      export CVAT_HOST=$IP
#      export CVAT_BASE_URL=https://$IP
#      docker compose -f docker-compose.yml -f docker-compose.https-selfsigned.yml up -d
#
# Notes:
# - Browsers will show a warning unless you trust the certificate / CA on clients.
# - If you prefer to access by a hostname, add it to clients' /etc/hosts and
#   generate a cert with subjectAltName=DNS:your-hostname instead.

services:
  cvat_server:
    labels:
      traefik.http.routers.cvat.entrypoints: websecure
      traefik.http.routers.cvat.tls: "true"

  cvat_ui:
    labels:
      traefik.http.routers.cvat-ui.entrypoints: websecure
      traefik.http.routers.cvat-ui.tls: "true"

  traefik:
    environment:
      TRAEFIK_ENTRYPOINTS_web_ADDRESS: :80
      TRAEFIK_ENTRYPOINTS_web_HTTP_REDIRECTIONS_ENTRYPOINT_TO: websecure
      TRAEFIK_ENTRYPOINTS_web_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_websecure_ADDRESS: :443
    ports:
      # Expose CVAT on custom host ports.
      # - HTTPS: https://<host-or-ip>:${CVAT_HTTPS_PORT:-5825}
      # - HTTP (optional, will redirect to HTTPS): http://<host-or-ip>:${CVAT_HTTP_PORT:-5824}
      - ${CVAT_HTTP_PORT:-5824}:80
      - ${CVAT_HTTPS_PORT:-5826}:443
      # Optional: Traefik dashboard entrypoint (requires enabling it in docker-compose.yml)
      # - ${TRAEFIK_DASHBOARD_PORT:-8090}:8090
    volumes:
      - ./components/traefik/selfsigned_tls.yml:/etc/traefik/rules/selfsigned_tls.yml:ro
      - ./certs:/certs:ro



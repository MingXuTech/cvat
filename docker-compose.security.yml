# Security hardening overrides for CVAT
# - Traefik access log to file (for fail2ban/crowdsec)
# - Block /api/auth/register at the edge

services:
  traefik:
    environment:
      TRAEFIK_ACCESSLOG_FILEPATH: /var/log/traefik/access.log
      # Disable buffering to make bans react faster
      TRAEFIK_ACCESSLOG_BUFFERINGSIZE: "0"
    volumes:
      - ./logs/traefik:/var/log/traefik

  cvat_deny:
    image: nginx:1.27-alpine
    container_name: cvat_deny
    restart: always
    volumes:
      - ./components/security/deny.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cvat
    labels:
      traefik.enable: "true"
      # Block registration endpoint
      traefik.http.routers.cvat-register.rule: (Host(`${CVAT_HOST:-localhost}`) || Host(`${CVAT_ALT_HOST:-localhost}`)) && PathPrefix(`/api/auth/register`)
      traefik.http.routers.cvat-register.entrypoints: websecure
      traefik.http.routers.cvat-register.tls: "true"
      traefik.http.routers.cvat-register.priority: "200"
      traefik.http.services.cvat-register.loadbalancer.server.port: "80"

metadata:
  name: pth-yview-rfdetr-ensemble12
  namespace: cvat
  annotations:
    name: RF-DETR 12-class
    type: detector
    spec: |
      [
        { "id": 0, "name": "上皮细胞", "type": "mask" },
        { "id": 1, "name": "基地旁上皮细胞", "type": "mask" },
        { "id": 2, "name": "孢子", "type": "mask" },
        { "id": 3, "name": "杆菌", "type": "mask" },
        { "id": 4, "name": "滴虫", "type": "mask" },
        { "id": 5, "name": "球菌", "type": "mask" },
        { "id": 6, "name": "白细胞", "type": "mask" },
        { "id": 7, "name": "红细胞", "type": "mask" },
        { "id": 8, "name": "线索细胞", "type": "mask" },
        { "id": 9, "name": "脓细胞", "type": "mask" },
        { "id": 10, "name": "芽孢", "type": "mask" },
        { "id": 11, "name": "菌丝", "type": "mask" }
      ]

spec:
  description: RF-DETR 12-class detector refined to masks with SAM
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 600s
  env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: "0,1,2,5"
    - name: CUDA_VISIBLE_DEVICES
      value: "0,1,2,3"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
    - name: RFDETR_UPSTREAM_URL
      value: http://172.20.2.148:8787/api/detect
    - name: RFDETR_UPSTREAM_URLS
      value: http://172.20.2.148:8787/api/detect,http://172.20.2.148:8788/api/detect,http://172.20.2.148:8789/api/detect,http://172.20.2.148:8790/api/detect
    - name: RFDETR_REQUEST_TIMEOUT
      value: "300"
    - name: RFDETR_MODEL_KEY
      value: ensemble12
    - name: RFDETR_FILTER_BUDSPORE
      value: "false"
    - name: RFDETR_LABEL
      value: ""
    - name: RFDETR_LABEL_MAP
      value: '{"0":"上皮细胞","1":"基地旁上皮细胞","2":"孢子","3":"杆菌","4":"滴虫","5":"球菌","6":"白细胞","7":"红细胞","8":"线索细胞","9":"脓细胞","10":"芽孢","11":"菌丝"}'
    - name: SAM_CHECKPOINT
      value: /opt/nuclio/sam/sam_vit_h_4b8939.pth
    - name: SAM_MODEL_TYPE
      value: vit_h

  build:
    image: cvat.pth.yview.rfdetr.ensemble12:latest-gpu
    baseImage: cvat.pth.facebookresearch.sam.vit_h:latest-gpu

    directives:
      preCopy:
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=0,1,2,5
        - kind: ENV
          value: CUDA_VISIBLE_DEVICES=0,1,2,3
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
        - kind: USER
          value: root
        - kind: WORKDIR
          value: /opt/nuclio/function

  triggers:
    myHttpTrigger:
      numWorkers: 4
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
